# CI without secrets (audit §4.2): synthetic env literals exercise the
# validation and build paths; the RLS job runs the real migrations and
# cross-tenant isolation tests against a disposable Postgres.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run. Added after a pull_request event failed to start CI at all
  # on PR #16: a pull request with no CI attached looks calmer than a red one
  # and is worse, because there is nothing to notice. This gives a way to start
  # the run without pushing a commit whose only purpose is to poke GitHub.
  workflow_dispatch:

jobs:
  # Which jobs are worth running for this change.
  #
  # Plain git rather than a marketplace action: the rule is four greps, and a
  # third-party action in the one workflow that gates every merge is a
  # supply-chain surface bought for no convenience.
  #
  # Anything that is not a pull request (a push to main, a manual re-run) runs
  # everything. Skipping work on a guess is only safe when the guess is cheap
  # to check, and on main it is not.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      envconfig: ${{ steps.filter.outputs.envconfig }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "envconfig=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)
          files=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"; echo "$files"

          # Everything the end-to-end suite actually exercises. A PR touching
          # only docs cannot break a browser test, and spending three minutes
          # of Docker pulls to prove it is how the minutes ran out.
          if echo "$files" | grep -Eq '^(src/|supabase/|tests/|playwright\.config\.ts|next\.config\.ts|package\.json|package-lock\.json|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

          # The no-env build only proves one thing: the public site still
          # builds when no platform variables are set. Only env and build
          # configuration can change that answer.
          if echo "$files" | grep -Eq '^(next\.config\.ts|src/lib/env/|package\.json|package-lock\.json)'; then
            echo "envconfig=true" >> "$GITHUB_OUTPUT"
          else
            echo "envconfig=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      # A bare `const { data } = await supabase...` discards the error, so a
      # failed query and an empty result become the same value. That has cost
      # three defects (onboarding loop, lost sheet row, every job edit), and a
      # comment asking people to check `error` demonstrably did not hold — one
      # of the three was written after the comment. So it is a build failure.
      - name: No unchecked Supabase reads
        run: |
          set -uo pipefail
          hits=$(grep -rn --include=\*.ts --include=\*.tsx \
            -E 'const \{ data(: [A-Za-z_]+)? \} = await' src/ \
            | grep -v 'error' \
            | grep -vE '^[^:]+:[0-9]+: *(\*|//)' || true)
          if [ -n "$hits" ]; then
            echo "Unchecked Supabase read — use must()/maybe() from @/lib/supabase/query,"
            echo "or destructure the error and handle it explicitly:"
            echo "$hits"
            exit 1
          fi
          echo "No unchecked Supabase reads."

      - run: npm test
      # The platform build compiles every route, so it is the one that catches
      # ordinary breakage; it always runs.
      - name: Build (platform mode, synthetic env)
        run: npm run build
        env:
          # The canonical project ref is pinned in src/lib/supabase/target.ts;
          # it is public (part of the project URL), the keys stay synthetic.
          NEXT_PUBLIC_SUPABASE_URL: https://whwzfdkdxyycsvyvyxdn.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-key
          SUPABASE_PROJECT_REF: whwzfdkdxyycsvyvyxdn
          SUPABASE_SERVICE_ROLE_KEY: synthetic-service-key

      # The second build answers a narrower question — does the public site
      # still build with no platform env at all — and only env or build config
      # can change that answer.
      - name: Build (public-site mode, no env)
        if: needs.changes.outputs.envconfig == 'true'
        run: npm run build

  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ha_test
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply Supabase shim
        run: psql -h localhost -p 54322 -U postgres -d ha_test -v ON_ERROR_STOP=1 -f supabase/tests/supabase_shim.sql
      - name: Apply migrations
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -p 54322 -U postgres -d ha_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run RLS isolation tests
        run: psql -h localhost -p 54322 -U postgres -d ha_test -v ON_ERROR_STOP=1 -f supabase/tests/rls_isolation_test.sql

      # The types are checked against the schema the *migrations* produce, not
      # against the live project: no secrets, and the thing that must not drift
      # is exactly the migrations.
      #
      # Read straight from information_schema rather than running
      # `supabase gen types`, which needs Docker to pull postgres-meta — the
      # first real run of that hit `toomanyrequests: Rate exceeded`. A guard
      # that depends on a public registry being in a good mood gets switched
      # off the third time it flakes. Node is already on the runner and the
      # database is already in this job, so this step has no moving parts.
      - name: Dump the migrated schema
        run: |
          psql -h localhost -p 54322 -U postgres -d ha_test -tAc "
            select coalesce(json_agg(json_build_object(
              'table_name', c.table_name,
              'column_name', c.column_name,
              'udt_name', c.udt_name,
              'is_nullable', c.is_nullable = 'YES'
            ) order by c.table_name, c.ordinal_position), '[]'::json)
            from information_schema.columns c
            join information_schema.tables t
              on t.table_schema = c.table_schema
             and t.table_name = c.table_name
             and t.table_type = 'BASE TABLE'
            where c.table_schema = 'public';" > /tmp/schema.json

      - name: database.types.ts matches the migrations
        run: node scripts/check-db-types.mjs /tmp/schema.json src/lib/supabase/database.types.ts

  # End-to-end (§37.3): a real browser against a real Next.js server and a real
  # Supabase — the CLI stack on the runner, so RLS, the auth server and the
  # activity triggers are all in the loop. Still no secrets: the local stack's
  # keys are fixed development values printed by `supabase status`.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Start the local Supabase stack
        # Only what the app touches: Postgres, the API and the auth server.
        run: npx supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,mailpit

      - name: Point the app at the local stack
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            # The target guard pins the canonical ref; a localhost URL is
            # accepted as the development stack (src/lib/supabase/target.ts).
            echo "SUPABASE_PROJECT_REF=whwzfdkdxyycsvyvyxdn"
            echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3100"
          } >> "$GITHUB_ENV"

      # The stub stands in for Google so the run can assert that every event
      # marked `synced` produced a row. It is started before the build so the
      # app picks up the overridden endpoints from the environment.
      - name: Start the Sheets stub
        run: |
          node tests/e2e/sheets-stub.mjs &
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:4545/token > /dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:4545/token > /dev/null

      - name: Start the AI stub
        run: |
          node tests/e2e/ai-stub.mjs &
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:4547/__stub/health > /dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:4547/__stub/health > /dev/null

      - name: Start the Resend stub
        run: |
          node tests/e2e/resend-stub.mjs &
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:4546/__stub/health > /dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:4546/__stub/health > /dev/null

      - name: Point Google at the stub
        run: |
          {
            echo "GOOGLE_SHEETS_API_BASE=http://127.0.0.1:4545/v4/spreadsheets"
            echo "GOOGLE_OAUTH_TOKEN_URL=http://127.0.0.1:4545/token"
            echo "GOOGLE_CLIENT_ID=stub-client-id"
            echo "GOOGLE_CLIENT_SECRET=stub-client-secret"
            # Fixed, non-secret: it only has to decrypt what this run encrypted.
            echo "GOOGLE_TOKEN_ENCRYPTION_KEY=aGFuZHlhbGxpYW5jZS1jaS1zdHViLWtleS0wMDAwMDA="
            echo "CRON_SECRET=stub-cron-secret"
            echo "SHEETS_STUB_STATE=/tmp/sheets-stub.json"
            # Email goes to the stub, never to Resend. The key is a placeholder
            # the stub only checks the shape of; no secret is involved.
            echo "RESEND_API_BASE=http://127.0.0.1:4546"
            echo "RESEND_API_KEY=stub-resend-key"
            echo "RESEND_FROM_EMAIL=noreply@handyalliance.test"
            echo "RESEND_STUB_STATE=/tmp/resend-stub.json"
            # The model is stubbed too — no test ever calls a real one.
            echo "AI_API_BASE=http://127.0.0.1:4547"
            echo "AI_PROVIDER_API_KEY=stub-ai-key"
            echo "AI_PROVIDER_MODEL=claude-sonnet-5"
            echo "AI_STUB_STATE=/tmp/ai-stub.json"
          } >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      # The browser download is ~180 MB and unchanged between runs; only the
      # apt libraries have to be put back on a fresh runner each time.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      # When an e2e test fails the question is always the same: did the row
      # reach the database or not? Answering it here beats guessing from a
      # screenshot of a missing element.
      - name: Diagnose on failure
        if: failure()
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -c \
            "select
               (select count(*) from auth.users) as auth_users,
               (select count(*) from public.profiles) as profiles,
               (select count(*) from public.organizations) as organizations,
               (select count(*) from public.organization_members) as members,
               (select count(*) from public.jobs) as jobs;" || true
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -c \
            "select rolname, rolsuper, rolbypassrls from pg_roles
             where rolname in ('postgres','supabase_admin','authenticated','anon');" || true
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -c \
            "select p.proname, r.rolname as owner, r.rolsuper, r.rolbypassrls
             from pg_proc p join pg_roles r on r.oid = p.proowner
             join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public' and p.proname in ('create_organization','import_jobs');" || true
          # GoTrue's own log, not just the browser's notice. A failed auth
          # request (e.g. the mailer choking on a template, or an email
          # address failing GoTrue's own validator) shows only a generic
          # message client-side; the reason lives in this container.
          #
          # Two rounds of this diagnostic already taught the same lesson
          # twice, two different ways: a `--tail N` line-count window can miss
          # the one request that matters entirely, because this suite's other
          # tests generate enough of their own traffic (session polling, sign
          # up/in audit events) to push it out of the window regardless of how
          # generous N is (200, then 400 — both missed it; see
          # docs/HANDYALLIANCE_ARCHITECTURE.md §5i). Excluding one noisy path
          # at a time never keeps up with however many other paths are noisy
          # this run. So: capture the whole log to a file first, no truncation
          # at the capture step, then search it two ways that don't depend on
          # volume at all — an inclusive keyword grep (rare terms stay rare no
          # matter how much unrelated traffic surrounds them) and the
          # container's actual environment (settles what GoTrue was even
          # configured with, instead of inferring it from config.toml and
          # hoping the CLI translated it the way expected).
          docker ps -a --filter "name=auth" || true
          AUTH_CONTAINER="$(docker ps -a --filter 'name=auth' --format '{{.Names}}' | head -1)"
          docker logs "$AUTH_CONTAINER" > /tmp/gotrue-full.log 2>&1 || true
          echo "---- GOTRUE_MAILER_* / GOTRUE_SMTP_* env actually passed to the container ----"
          docker inspect "$AUTH_CONTAINER" --format '{{json .Config.Env}}' 2>/dev/null \
            | tr ',' '\n' | grep -i 'MAILER\|SMTP' || true
          echo "---- log lines mentioning the otp/mail/validation path, any error, any panic ----"
          grep -iE 'otp|magiclink|magic_link|mail|valid|template|panic|error|unexpected_failure' /tmp/gotrue-full.log \
            | grep -v 'GOTRUE_MAILER_EXTERNAL_HOSTS' \
            | grep -v '"path":"/user"' || true

      - name: Stop the stack
        if: always()
        run: npx supabase stop --no-backup || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
