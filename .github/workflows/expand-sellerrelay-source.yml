name: Expand SellerRelay source

on:
  push:
    branches:
      - agent/sellerrelay-site

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and expand SellerRelay application
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          chunks=(apps/.sellerrelay-source/chunk-*)
          if (( ${#chunks[@]} == 0 )); then
            echo "Source bundle is already expanded."
            exit 0
          fi

          cat "${chunks[@]}" > /tmp/sellerrelay-source.tar.gz.b64
          base64 --decode /tmp/sellerrelay-source.tar.gz.b64 > /tmp/sellerrelay-source.tar.gz
          echo "154bfa9ddcc1b159e3859a8da36616598751741927ae42d0a17a47494311161b  /tmp/sellerrelay-source.tar.gz" | sha256sum --check -

          rm -rf apps/sellerrelay
          mkdir -p apps/sellerrelay
          tar -xzf /tmp/sellerrelay-source.tar.gz -C apps/sellerrelay
          rm -rf apps/.sellerrelay-source

          test -f apps/sellerrelay/package.json
          test -f apps/sellerrelay/src/app/page.tsx
          test -f apps/sellerrelay/supabase/migrations/20260805000100_sellerrelay_leads.sql

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps
          git commit -m "Add SellerRelay application source"
          git push origin HEAD:agent/sellerrelay-site
